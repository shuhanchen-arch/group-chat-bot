[project]
name = "group-chat-bot"
version = "0.1.0"
description = "QQ 群 AI 机器人：NapCat + NoneBot2，本地模型 + DeepSeek V4.1 Flash 限额 + 生图"
requires-python = ">=3.10"
authors = [{ name = "shuhanchen-arch", email = "shuhan.chen17@gmail.com" }]
dependencies = [
    "nonebot2[fastapi]>=2.4",
    "nonebot-adapter-onebot>=2.4",
    "httpx>=0.27",
    # Windows 没有系统时区数据库，zoneinfo 需要它
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.nonebot]
adapters = [{ name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }]
plugin_dirs = ["src/plugins"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
